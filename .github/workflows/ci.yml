name: Project checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  project-checks:
    name: Lint, tests, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint, tests, and build
        run: npm run check
